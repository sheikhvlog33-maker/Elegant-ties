<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Ties - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #fff0f5; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        button { background-color: #ff69b4; color: white; cursor: pointer; border: none; font-weight: bold; }
        .product-card { border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 10px; background: #fff; position: relative; }
        img { max-width: 100%; border-radius: 10px; }
        .del-btn { background-color: #ff4d4d; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:#d02090;">Elegant Ties Admin</h2>
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="price" placeholder="Price (PKR)">
    <input type="file" id="image" accept="image/*">
    <button onclick="addItem()">Add to Website</button>
    <hr>
    <div id="product-list"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5vNGFV16jT7TqPnbfg4o1ZrPAGxrw67k",
      authDomain: "elegant-ties-by-mrs-ajazsheikh.firebaseapp.com",
      databaseURL: "https://elegant-ties-by-mrs-ajazsheikh-default-rtdb.firebaseio.com",
      projectId: "elegant-ties-by-mrs-ajazsheikh",
      storageBucket: "elegant-ties-by-mrs-ajazsheikh.firebasestorage.app",
      messagingSenderId: "294111960990",
      appId: "1:294111960990:web:c386907a3504605ea5808f"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const database = firebase.database();

    function addItem() {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const file = document.getElementById('image').files[0];
        if(!name || !price || !file) { alert("Please fill everything!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            database.ref('products').push({ name, price, image: e.target.result });
            alert("Product Added!");
        };
        reader.readAsDataURL(file);
    }

    function deleteItem(id) {
        if(confirm("Kya aap ye product delete karna chahti hain?")) {
            database.ref('products/' + id).remove();
            alert("Deleted!");
        }
    }

    database.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('product-list');
        list.innerHTML = "<h3>Current Products</h3>";
        for (let id in data) {
            list.innerHTML += `
                <div class="product-card">
                    <img src="${data[id].image}">
                    <h4>${data[id].name}</h4>
                    <p>Rs. ${data[id].price}</p>
                    <button class="del-btn" onclick="deleteItem('${id}')">Delete Product</button>
                </div>`;
        }
    });
</script>
</body>
</html>
