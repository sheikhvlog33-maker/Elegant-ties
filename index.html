<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Ties by Mrs Ajaz Sheikh</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #fff0f5; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #ff69b4; }
        h2 { color: #d02090; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background-color: #ff69b4; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background-color: #d02090; }
        .product-card { border: 1px solid #ffc0cb; padding: 15px; margin-top: 20px; border-radius: 12px; background: #fff; }
        img { max-width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .price-tag { color: #d02090; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h2>Elegant Ties - Admin</h2>
    <input type="text" id="name" placeholder="Item Name (e.g., Pink Gajray)">
    <input type="number" id="price" placeholder="Price in PKR">
    <input type="file" id="image" accept="image/*">
    <button onclick="addItem()">Upload to Shop</button>
    <div id="product-list"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5vNGFV16jT7TqPnbfg4o1ZrPAGxrw67k",
      authDomain: "elegant-ties-by-mrs-ajazsheikh.firebaseapp.com",
      databaseURL: "https://elegant-ties-by-mrs-ajazsheikh-default-rtdb.firebaseio.com",
      projectId: "elegant-ties-by-mrs-ajazsheikh",
      storageBucket: "elegant-ties-by-mrs-ajazsheikh.firebasestorage.app",
      messagingSenderId: "294111960990",
      appId: "1:294111960990:web:c386907a3504605ea5808f"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const database = firebase.database();

    function addItem() {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const file = document.getElementById('image').files[0];
        if(!name || !price || !file) { alert("Please fill all details!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            database.ref('products').push({ name, price, image: e.target.result })
            .then(() => { alert("Product added!"); location.reload(); });
        };
        reader.readAsDataURL(file);
    }

    database.ref('products').on('value', (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('product-list');
        list.innerHTML = "<h3>Live Products</h3>";
        for (let id in data) {
            list.innerHTML += `
                <div class="product-card">
                    <img src="${data[id].image}">
                    <h4>${data[id].name}</h4>
                    <p class="price-tag">Rs. ${data[id].price}</p>
                    <button style="background:#25d366" onclick="window.open('https://wa.me/923000000000?text=I want ${data[id].name}')">Order on WhatsApp</button>
                </div>`;
        }
    });
</script>
</body>
</html>
