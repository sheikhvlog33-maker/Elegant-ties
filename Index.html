<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Ties by Mrs Ajazsheikh</title>
    <style>
        :root { --gold: #D4AF37; --dark: #1a1a1a; --white: #ffffff; --grey: #f4f4f4; }
        body { font-family: 'Georgia', serif; background-color: var(--grey); margin: 0; padding-bottom: 50px; }
        header { background: var(--dark); color: var(--gold); padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        header h1 { margin: 0; font-size: 2.2em; text-transform: uppercase; letter-spacing: 2px; }
        .admin-panel { max-width: 90%; margin: -30px auto 40px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid var(--gold); box-sizing: border-box; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .publish-btn { background: var(--dark); color: var(--gold); border: 2px solid var(--gold); padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .container { max-width: 1200px; margin: auto; padding: 10px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #eee; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 10px; text-align: center; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(255, 0, 0, 0.7); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        .card-body h3 { margin: 5px 0; font-size: 1.1em; }
        .whatsapp-btn { background: #25D366; color: white; text-decoration: none; padding: 8px; display: block; border-radius: 5px; font-size: 0.9em; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <h1>Elegant Ties</h1>
    <p style="color:white;">by Mrs Ajazsheikh</p>
</header>

<div class="admin-panel">
    <h3 style="margin-top:0;">Add New Tie</h3>
    <input type="file" id="imgInp" accept="image/*">
    <input type="text" id="nameInp" placeholder="Tie Name (Optional)">
    <input type="text" id="priceInp" placeholder="Price (Optional)">
    <textarea id="descInp" placeholder="Description (Optional)" rows="2"></textarea>
    <button class="publish-btn" onclick="publish()">Add to Shop</button>
</div>

<div class="container">
    <div class="product-grid" id="grid"></div>
</div>

<script>
    const myPhone = "923473184408"; 

    function publish() {
        const imgFile = document.getElementById('imgInp').files[0];
        const name = document.getElementById('nameInp').value || "Exclusive Tie";
        const price = document.getElementById('priceInp').value;
        const grid = document.getElementById('grid');

        if (!imgFile) { alert("Please picture select karein!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'card';
            const waLink = `https://wa.me/${myPhone}?text=I want to order: ${name}`;

            div.innerHTML = `
                <button class="delete-btn" onclick="this.parentElement.remove()">×</button>
                <img src="${e.target.result}">
                <div class="card-body">
                    <h3>${name}</h3>
                    ${price ? `<div style="color:#b12704; font-weight:bold;">${price}</div>` : ''}
                    <a href="${waLink}" target="_blank" class="whatsapp-btn">Order Now</a>
                </div>
            `;
            grid.prepend(div);
        };
        reader.readAsDataURL(imgFile);

        document.getElementById('imgInp').value = "";
        document.getElementById('nameInp').value = "";
        document.getElementById('priceInp').value = "";
    }
</script>

</body>
</html>
